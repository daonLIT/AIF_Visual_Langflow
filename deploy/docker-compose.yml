# 중앙 AIF 서버 운영 구성: Caddy(HTTPS, 인증서 자동) → aif(웹 + API). 데이터는 이름 있는 볼륨에 남는다.
#   cp deploy/.env.example deploy/.env   # 도메인·이메일 등 채우기
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# 자세한 절차: docs/deploy.md
name: aif-central

services:
  aif:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: aif-central:${AIF_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      AIF_PUBLIC_SITE_URL: https://${AIF_DOMAIN:?AIF_DOMAIN 을 .env 에 넣으세요}
      AIF_SESSION_TTL_HOURS: ${AIF_SESSION_TTL_HOURS:-12}
      AIF_MAX_PUBLISH_BYTES: ${AIF_MAX_PUBLISH_BYTES:-6000000}
    volumes:
      - aif-data:/data
      - ${AIF_BACKUP_DIR:-./backups}:/backups
    # 바깥에 직접 열지 않는다. Caddy 만 닿는다.
    expose:
      - "8000"

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on:
      aif:
        condition: service_healthy
    ports:
      - "${AIF_HTTP_PORT:-80}:80"
      - "${AIF_HTTPS_PORT:-443}:443"
    environment:
      AIF_DOMAIN: ${AIF_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  aif-data:
  caddy-data:
  caddy-config:
